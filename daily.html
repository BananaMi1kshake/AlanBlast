<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d41">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./themes.css">
  <link rel="stylesheet" href="./materials.css">
  <link rel="stylesheet" href="./interface.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./modes.css">
  <title>Daily Challenge · AlanBlox</title>
  <script type="module" src="./js/daily-view.js"></script>
</head>
<body>
  <main class="mode-shell">
    <header class="menu-top"><a class="mode-back" href="./index.html">← Menu</a><span class="menu-brand">AlanBlox</span></header>
    <h1>Daily Challenge</h1>
    <p>One shared puzzle per UTC date. Replay any earlier challenge.</p>
    <label for="challenge-date">Challenge date</label>
    <div class="daily-calendar">
      <button type="button" class="secondary" id="earlier-day" aria-label="Previous date">←</button>
      <input type="date" id="challenge-date">
      <button type="button" class="secondary" id="later-day" aria-label="Next date">→</button>
    </div>
    <section class="world-card daily-card">
      <div id="daily-art" class="world-art" aria-hidden="true"></div>
      <h2 id="daily-name">Loading puzzle…</h2>
      <p id="daily-status" role="status"></p>
      <a class="primary mode-action" id="daily-play" href="./play.html?mode=daily" hidden>Play challenge</a>
    </section>
  </main>
</body>
</html>
