<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="A free, offline-friendly block puzzle game.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>AlanBlox</title>
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>Alan<span>Blox</span></h1>
      </div>
      <button class="restart" type="button" id="restart" aria-label="Restart game" title="Restart game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2 6.5M4 5v6h6"/></svg>
      </button>
    </header>

    <section class="scoreboard" aria-label="Scores">
      <div class="score-card"><span>Score</span><strong id="score">0</strong></div>
      <div class="score-card best"><span>Best</span><strong id="high-score">0</strong></div>
      <div class="score-card"><span>Combo</span><strong id="combo">0</strong></div>
    </section>

    <div class="board-frame">
      <div id="board" class="board" role="grid" aria-label="Puzzle board" aria-describedby="controls" aria-rowcount="8" aria-colcount="8"></div>
      <div id="game-over" class="game-over" hidden>
        <div>
          <h2>Game over</h2>
          <p id="game-over-message">No remaining piece fits.</p>
          <button type="button" id="play-again">Play again</button>
        </div>
      </div>
    </div>

    <section class="pieces" aria-label="Available pieces">
      <p id="controls">Drag a piece onto the board.<span class="sr-only"> You can also select a piece, then tap a cell or use the arrow keys and Enter to place it.</span></p>
      <p id="clear-notice" hidden></p>
      <p id="hand-pending" hidden></p>
      <button id="retry-hand" type="button" hidden>Retry deal</button>
      <div id="tray" class="tray">
        <button type="button" data-slot="0"></button>
        <button type="button" data-slot="1"></button>
        <button type="button" data-slot="2"></button>
      </div>
    </section>
    <p id="status" class="sr-only" role="status"></p>
  </main>
</body>
</html>
