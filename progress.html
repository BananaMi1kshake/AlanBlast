<!doctype html>
<html lang="en" class="app-viewport">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d41">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./themes.css">
  <link rel="stylesheet" href="./materials.css">
  <link rel="stylesheet" href="./interface.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./modes.css">
  <link rel="stylesheet" href="./design.css">
  <link rel="stylesheet" href="./viewport.css">
  <script type="module" src="./js/play-viewport.js"></script>
  <title>Progress · AlanBlox</title>
  <script type="module" src="./js/progress-view.js"></script>
</head>
<body>
  <main class="mode-shell">
    <header class="menu-top"><a class="mode-back" href="./index.html">← Menu</a><span class="menu-brand">AlanBlox</span>
    <button id="appearance-toggle" type="button" class="secondary" hidden>Classic appearance</button>
    </header>
    <nav class="page-tabs" aria-label="Progress">
      <a href="?view=materials" data-tab="materials">Materials</a>
      <a href="?view=stats" data-tab="stats">Statistics</a>
      <a href="?view=achievements" data-tab="achievements">Achievements</a>
    </nav>
    <h1 id="progress-title" class="screen-heading"></h1>
    <p id="progress-description" class="screen-caption" role="status"></p>
    <nav id="stats-tabs" aria-label="Statistics mode" hidden></nav>
    <form id="appearance-controls" class="world-card" hidden>
      <label>Classic appearance
        <select id="appearance-mode">
          <option value="automatic">Automatic rotation</option>
          <option value="starting">Favorite first, then rotate</option>
          <option value="fixed">Fixed favorite</option>
        </select>
      </label>
      <label>Favorite material <select id="favorite-material"></select></label>
      <p>Applies when you start a new Classic game.</p>
    </form>
    <div class="progress-cards" id="progress-content"></div>
    <nav id="screen-pager" class="screen-pager" aria-label="Pages" hidden>
      <button type="button" class="secondary">Previous</button><output aria-live="polite"></output><button type="button" class="secondary">Next</button>
    </nav>
  </main>
  <dialog id="material-detail" class="compact-dialog" aria-labelledby="material-name">
    <h2 id="material-name"></h2>
    <div id="material-art" class="world-art" aria-hidden="true"></div>
    <p id="material-requirement"></p>
    <form method="dialog"><button type="submit" class="primary">Back to collection</button></form>
  </dialog>
</body>
</html>
